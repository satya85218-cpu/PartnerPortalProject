<template>
    <lightning-card
        title="Partner Deal Details"
        icon-name="standard:opportunity">

        <div class="slds-p-around_medium">

            <template if:true={deal}>

                <div class="slds-grid slds-wrap slds-gutters">

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <strong>Deal Name</strong>
                        <div>{deal.Name}</div>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <strong>Customer</strong>
                        <div>{deal.customerName}</div>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <strong>Partner</strong>
                        <div>{deal.partnerName}</div>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <strong>Deal Amount</strong>
                        <lightning-formatted-number
                            value={deal.Deal_Amount__c}
                            format-style="currency">
                        </lightning-formatted-number>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <strong>Discount</strong>
                        <div>{deal.Discount_Percentage__c}%</div>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <strong>Status</strong>
                        <div>{deal.Status__c}</div>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <strong>Approval Status</strong>
                        <div>{deal.Approval_Status__c}</div>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <strong>Submitted Date</strong>
                        <lightning-formatted-date-time
                            value={deal.Submitted_Date__c}>
                        </lightning-formatted-date-time>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <strong>Approved Date</strong>
                        <lightning-formatted-date-time
                            value={deal.Approved_Date__c}>
                        </lightning-formatted-date-time>
                    </div>

                </div>

            </template>

            <template if:true={error}>
                <p class="slds-text-color_error">
                    Unable to load Partner Deal details.
                </p>
            </template>

        </div>

    </lightning-card>
</template>
