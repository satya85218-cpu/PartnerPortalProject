<template>
  <lightning-card title="Partner Deals" icon-name="standard:opportunity">
    <div class="slds-p-around_medium">
      <!--Search + Status Filter-->
      <div class="slds-grid slds-gutters slds-m-bottom_medium">
        <div class="slds-col slds-size_2-of-3">
          <lightning-input
            type="search"
            label="Search Deal"
            placeholder="Search by Deal Name"
            value={searchKey}
            onchange={handleSearch}
          >
          </lightning-input>
        </div>

        <div class="slds-col slds-size_1-of-3">
          <lightning-combobox
            label="Status"
            value={selectedStatus}
            options={statusOptions}
            onchange={handleStatusChange}
          >
          </lightning-combobox>
        </div>
      </div>
      <!--Loading Spinner-->
      <template if:true={isLoading}>
        <lightning-spinner
          alternative-text="Loading Partner Deals"
          size="medium"
        >
        </lightning-spinner>
      </template>
      <!--data table-->
      <template if:true={filteredDeals}>
        <lightning-datatable
          key-field="Id"
          data={filteredDeals}
          columns={columns}
          hide-checkbox-column
          onsort={handleSort}
        >
        </lightning-datatable>
      </template>
      <!--Error-->
      <template if:true={error}>
        <p class="slds-text-color_error">Unable to load Partner Deals.</p>
      </template>
    </div>
  </lightning-card>
</template>
